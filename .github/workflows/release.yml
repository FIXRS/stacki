name: Release

on:
  # A manual run validates Linux installers without publishing a release.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci
      # The full gate, as on every platform: a release is never built from code that
      # fails it. npm test builds the app as its first step.
      - run: npm test
      - name: Validate mac signing secrets
        run: |
          test -n "$MAC_CSC_LINK" || { echo "MAC_CSC_LINK is missing"; exit 1; }
          test -n "$MAC_CSC_KEY_PASSWORD" || { echo "MAC_CSC_KEY_PASSWORD is missing"; exit 1; }
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      - run: npx electron-builder --mac --publish always
        env:
          DEBUG: electron-osx-sign*,electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: 'data:application/x-pkcs12;base64,${{ secrets.MAC_CSC_LINK }}'
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EP_PRE_RELEASE: false
          # Upload into a draft. A release that is visible before every
          # platform has uploaded becomes "latest" with only some of its
          # assets, and the other platform's updater 404s on its missing
          # channel file. The publish job below flips the draft once all
          # builds have landed.
          EP_DRAFT: true

  build-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci
      - run: npm test
      # Windows signing is optional, matching the existing release channel.
      # Electron-builder signs when credentials exist and otherwise builds unsigned.
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          EP_PRE_RELEASE: false
          EP_DRAFT: true

  build-linux:
    # Build native modules on the oldest supported Ubuntu so the resulting
    # glibc/libstdc++ requirements also work on newer desktop distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci
      - name: Prepare Electron sandbox for tests
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run --auto-servernum npm test
      - run: >-
          npx electron-builder --linux
          --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EP_PRE_RELEASE: false
          EP_DRAFT: true
      - name: Install and test Debian package
        run: |
          sudo apt-get install --yes ./release/*.deb
          test "$(stat -c '%u:%g:%a' /opt/Stacki/chrome-sandbox)" = '0:0:4755'
          test "$(cat /opt/Stacki/resources/package-type)" = deb
          xvfb-run --auto-servernum node dist/scripts/release/linuxSmoke.js /opt/Stacki/stacki
      - name: Test portable AppImage payload and launcher
        run: |
          cd release
          for appimage in ./*.AppImage; do
            "$appimage" --appimage-extract >/dev/null
            export APPIMAGE="$(realpath "$appimage")"
          done
          test ! -e squashfs-root/resources/package-type
          test -f squashfs-root/resources/app-update.yml
          if grep -q -- --no-sandbox squashfs-root/*.desktop; then exit 1; fi
          xvfb-run --auto-servernum node ../dist/scripts/release/linuxSmoke.js \
            squashfs-root/AppRun
      - uses: actions/upload-artifact@v4
        with:
          name: linux-install-smoke
          path: |
            release/*.deb
            dist/scripts/release/linuxSmoke.js
          retention-days: 3

  test-linux-install:
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: linux-install-smoke
      # Exercise the installed sandbox under Ubuntu's newer AppArmor policy.
      # No global sysctl changes or sandbox-disabling launch flags are needed.
      - name: Install and launch on Ubuntu 24.04
        run: |
          sudo apt-get install --yes ./release/*.deb
          test "$(stat -c '%u:%g:%a' /opt/Stacki/chrome-sandbox)" = '0:0:4755'
          xvfb-run --auto-servernum node dist/scripts/release/linuxSmoke.js /opt/Stacki/stacki

  # Publish only when every platform has uploaded and both Linux installs work.
  publish:
    if: github.event_name == 'push'
    needs: [build-mac, build-windows, build-linux, test-linux-install]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all platforms uploaded, then publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --repo flowtricks/stacki-releases \
            --json assets --jq '[.assets[].name] | join(" ")')
          echo "assets: $assets"
          for required in latest-mac.yml latest.yml latest-linux.yml; do
            case " $assets " in
              *" $required "*) ;;
              *) echo "missing $required — refusing to publish"; exit 1 ;;
            esac
          done
          for suffix in AppImage deb; do
            case " $assets " in
              *".$suffix "*) ;;
              *) echo "missing Linux .$suffix package — refusing to publish"; exit 1 ;;
            esac
          done
          gh release edit "$TAG" --repo flowtricks/stacki-releases --draft=false --latest
